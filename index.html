<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Briefing</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="브리핑">
<meta name="application-name" content="브리핑">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0c14">
<meta name="description" content="PIN으로 잠긴 개인 일일 브리핑 앱.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<style>
/* ─────────────────────────── tokens ─────────────────────────── */
:root{
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;

  --bg: #e9eef8;
  --ink:  #0b0d12;
  --ink2: #3d434e;
  --ink3: #767e8c;
  --accent: #0a6cff;

  --g1: rgba(255,255,255,.58);
  --g2: rgba(255,255,255,.32);
  --hair: rgba(255,255,255,.92);
  --rim1: rgba(255,255,255,.95);
  --rim2: rgba(255,255,255,.18);
  --shadow: 0 18px 40px rgba(22,32,60,.14), 0 2px 5px rgba(22,32,60,.07);
  --shadow-sm: 0 6px 16px rgba(22,32,60,.08);
  --veil: rgba(238,241,247,.80);
  --navscrim: rgba(233,238,248,.94);
  --taboff: rgba(255,255,255,.62);

  --urgent:#d92d33; --urgent-bg:rgba(217,45,51,.11);
  --wait:#9a5b00;   --wait-bg:rgba(214,138,0,.13);
  --doing:#0a5ce0;  --doing-bg:rgba(10,108,255,.11);
  --live:#0a7a48;   --live-bg:rgba(15,154,89,.12);
  --pause:#5d6470;  --pause-bg:rgba(93,100,112,.12);

  --r: 22px;
  --r-sm: 16px;
  --pad: 18px;
}

@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg: #0a0c14;
    --ink:  #f3f5fa;
    --ink2: #c3c9d6;
    --ink3: #8b93a4;
    --accent: #57a5ff;

    --g1: rgba(70,78,104,.52);
    --g2: rgba(26,30,44,.46);
    --hair: rgba(255,255,255,.16);
    --rim1: rgba(255,255,255,.34);
    --rim2: rgba(255,255,255,.05);
    --shadow: 0 18px 44px rgba(0,0,0,.52), 0 1px 2px rgba(0,0,0,.4);
    --shadow-sm: 0 8px 20px rgba(0,0,0,.4);
    --veil: rgba(10,12,20,.80);
    --navscrim: rgba(10,12,20,.93);
    --taboff: rgba(255,255,255,.10);

    --urgent:#ff6b70; --urgent-bg:rgba(255,90,95,.16);
    --wait:#ffc061;   --wait-bg:rgba(255,176,60,.15);
    --doing:#6cb0ff;  --doing-bg:rgba(90,160,255,.16);
    --live:#5ce0a4;   --live-bg:rgba(70,220,150,.15);
    --pause:#a6adbb;  --pause-bg:rgba(166,173,187,.14);
  }
}

/* ─────────────────────────── base ─────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
  scroll-padding-top:120px;
}
body{
  margin:0;
  min-height:100dvh;
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  letter-spacing:-.012em;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(env(safe-area-inset-bottom) + 40px);
  overflow-x:hidden;
}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
b,strong{font-weight:650;color:var(--ink)}
a{color:var(--accent);text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
::selection{background:rgba(10,108,255,.22)}

/* ─────────────────────────── 배경: 메쉬 그라데이션 ─────────────────────────── */
.mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
.mesh::before,.mesh::after{content:"";position:absolute;inset:0}
.mesh::before{
  inset:0;
  background:
    radial-gradient(64% 52% at 2% -10%, rgba(60,144,255,.90) 0%, rgba(60,144,255,0) 70%),
    radial-gradient(58% 48% at 102% 4%,  rgba(136,92,255,.80) 0%, rgba(136,92,255,0) 72%),
    radial-gradient(64% 52% at 96% 94%,  rgba(40,208,184,.58) 0%, rgba(40,208,184,0) 74%),
    radial-gradient(60% 50% at -2% 100%, rgba(255,118,180,.52) 0%, rgba(255,118,180,0) 74%),
    radial-gradient(78% 34% at 26% 44%,  rgba(108,164,255,.44) 0%, rgba(108,164,255,0) 70%),
    radial-gradient(78% 34% at 88% 58%,  rgba(174,130,255,.36) 0%, rgba(174,130,255,0) 72%),
    radial-gradient(60% 30% at 60% 76%,  rgba(90,214,196,.22) 0%, rgba(90,214,196,0) 72%);
}
.mesh::after{
  inset:0;
  background:
    radial-gradient(74% 46% at 50% 44%, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 74%),
    radial-gradient(58% 40% at 50% 118%, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 74%);
}
@media (prefers-color-scheme: dark){
  .mesh::before{
    background:
      radial-gradient(56% 46% at -6% -8%, rgba(24,88,220,.95) 0%, rgba(24,88,220,0) 72%),
      radial-gradient(54% 44% at 106% -4%, rgba(96,48,214,.90) 0%, rgba(96,48,214,0) 72%),
      radial-gradient(58% 48% at 108% 92%, rgba(0,146,136,.55) 0%, rgba(0,146,136,0) 74%),
      radial-gradient(56% 48% at -8% 106%, rgba(150,32,104,.45) 0%, rgba(150,32,104,0) 74%);
  }
  .mesh::after{
    background:
      radial-gradient(64% 42% at 50% 36%, rgba(16,22,44,.55) 0%, rgba(16,22,44,0) 72%),
      radial-gradient(58% 40% at 50% 116%, rgba(20,30,64,.40) 0%, rgba(20,30,64,0) 74%);
  }
}
@media (prefers-reduced-motion: no-preference){
  .mesh::before{animation:drift 26s ease-in-out infinite alternate}
  @keyframes drift{
    from{transform:translate3d(0,0,0) scale(1)}
    to{transform:translate3d(-1.2%,1.6%,0) scale(1.04)}
  }
}

/* 상태바 스크림 (black-translucent 상태바 가독성) */
.statusveil{
  position:fixed;top:0;left:0;right:0;z-index:60;height:env(safe-area-inset-top);
  background:linear-gradient(180deg, var(--veil) 30%, transparent 100%);
  pointer-events:none;
}

/* ─────────────────────────── 글래스 표면 ─────────────────────────── */
.glass{
  position:relative;
  border-radius:var(--r);
  background:
    linear-gradient(180deg, rgba(255,255,255,.50) 0%, rgba(255,255,255,.06) 34%, rgba(255,255,255,0) 62%),
    linear-gradient(180deg, var(--g1), var(--g2));
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--shadow), inset 0 .5px 0 var(--hair), inset 0 -0.5px 0 rgba(20,30,60,.05);
  isolation:isolate;
}
.glass::after{ /* 스펙큘러 헤어라인 보더 */
  content:"";position:absolute;inset:0;border-radius:inherit;padding:.9px;
  background:linear-gradient(160deg, var(--rim1) 0%, var(--rim2) 38%, var(--rim2) 62%, var(--rim1) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite:exclude;
  pointer-events:none;
}
@media (prefers-color-scheme: dark){
  .glass{
    background:
      linear-gradient(180deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.02) 34%, rgba(255,255,255,0) 62%),
      linear-gradient(180deg, var(--g1), var(--g2));
    box-shadow:var(--shadow), inset 0 .5px 0 rgba(255,255,255,.20);
  }
}

/* ─────────────────────────── 상단 네비게이션 ─────────────────────────── */
.nav{
  position:sticky;top:0;z-index:50;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 6px;
  background:linear-gradient(180deg, var(--navscrim) 0%, var(--navscrim) 66%, transparent 100%);
  -webkit-backdrop-filter:blur(8px) saturate(140%);
  backdrop-filter:blur(8px) saturate(140%);
}
.nav-glass{
  border-radius:26px;
  padding:9px 11px 9px 14px;
  display:flex;flex-direction:column;gap:9px;
  max-width:1080px;margin:0 auto;
  background:
    linear-gradient(180deg, rgba(255,255,255,.60) 0%, rgba(255,255,255,.10) 36%, rgba(255,255,255,0) 64%),
    linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.93));
  -webkit-backdrop-filter:blur(34px) saturate(190%);
  backdrop-filter:blur(34px) saturate(190%);
  box-shadow:0 10px 30px rgba(22,32,60,.13), 0 1px 2px rgba(22,32,60,.08), inset 0 .5px 0 rgba(255,255,255,.95);
}
@media (prefers-color-scheme: dark){
  .nav-glass{
    background:
      linear-gradient(180deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.02) 36%, rgba(255,255,255,0) 64%),
      linear-gradient(180deg, rgba(38,43,60,.88), rgba(22,26,38,.80));
    box-shadow:0 12px 34px rgba(0,0,0,.55), inset 0 .5px 0 rgba(255,255,255,.18);
  }
}
.nav-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.brand-mark{
  width:22px;height:22px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(150deg,#4aa3ff 0%,#7b5cff 55%,#12c8b4 100%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.7), 0 2px 6px rgba(60,90,200,.35);
  position:relative;
}
.brand-mark::after{
  content:"";position:absolute;inset:6px 5px auto 5px;height:2.5px;border-radius:2px;
  background:rgba(255,255,255,.95);box-shadow:0 5px 0 rgba(255,255,255,.72), 0 10px 0 rgba(255,255,255,.45);
}
.brand-t{font-size:14px;font-weight:660;letter-spacing:-.03em;line-height:1.1;display:block}
.brand-s{display:none}

.datectl{display:flex;align-items:center;gap:2px;margin-left:auto;flex:1 1 auto;justify-content:flex-end;min-width:0}
.arrow{
  flex:0 0 auto;width:32px;height:32px;border:0;border-radius:11px;
  background:transparent;color:var(--ink2);font-size:17px;line-height:1;
  display:grid;place-items:center;cursor:pointer;
  transition:background .18s, opacity .18s, transform .12s;
  font-family:var(--font);
}
.arrow:active{transform:scale(.92);background:rgba(120,140,180,.14)}
.arrow[disabled]{opacity:.24;pointer-events:none}
.datewrap{position:relative;flex:0 1 auto;min-width:0}
.datewrap select{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;
  border:0;margin:0;padding:0;font-size:16px; /* iOS 확대 방지 */
  -webkit-appearance:none;appearance:none;cursor:pointer;
}
.dateface{
  display:flex;align-items:center;gap:5px;justify-content:center;
  padding:6px 11px;border-radius:12px;
  background:rgba(255,255,255,.5);
  box-shadow:inset 0 0 0 .7px rgba(255,255,255,.85), 0 1px 2px rgba(20,30,60,.06);
  font-size:13.5px;font-weight:640;letter-spacing:-.02em;white-space:nowrap;
  color:var(--ink);
}
@media (prefers-color-scheme: dark){
  .dateface{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 .7px rgba(255,255,255,.14)}
}
.dateface .chev{width:7px;height:7px;border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);
  transform:rotate(45deg) translateY(-1px);margin-left:1px;opacity:.85}
.todaytag{
  font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#fff;
  background:linear-gradient(140deg,#0a6cff,#5b48ff);
  padding:1.5px 7px;border-radius:999px;margin-left:2px;
}

/* 필터 칩 */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.filters::-webkit-scrollbar{display:none}
.chipf{
  flex:0 0 auto;border:0;cursor:pointer;font-family:var(--font);
  font-size:12.5px;font-weight:620;letter-spacing:-.01em;color:var(--ink2);
  padding:6px 12px;border-radius:999px;
  background:var(--taboff);
  box-shadow:inset 0 0 0 .7px rgba(255,255,255,.7);
  transition:background .18s, color .18s, transform .12s;
  -webkit-user-select:none;user-select:none;
}
.chipf:active{transform:scale(.96)}
.chipf[aria-pressed="true"]{
  color:#fff;background:linear-gradient(160deg,#1c2536,#0b0f18);
  box-shadow:0 2px 8px rgba(15,22,40,.28), inset 0 .5px 0 rgba(255,255,255,.25);
}
@media (prefers-color-scheme: dark){
  .chipf{box-shadow:inset 0 0 0 .7px rgba(255,255,255,.10)}
  .chipf[aria-pressed="true"]{background:linear-gradient(160deg,#f2f5ff,#cfd8ea);color:#0b0f18;box-shadow:0 2px 10px rgba(0,0,0,.4)}
}

/* ─────────────────────────── 레이아웃 ─────────────────────────── */
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--pad)}
main{padding-top:10px}

/* 히어로 */
.hero{padding:14px 0 4px}
.hero .eyebrow{
  font-size:12px;font-weight:640;letter-spacing:.06em;color:var(--ink3);
  text-transform:uppercase;display:flex;align-items:center;gap:7px;
}
.hero .eyebrow .dash{width:14px;height:1px;background:var(--ink3);opacity:.5}
.hero h1{
  font-size:28px;line-height:1.22;font-weight:700;letter-spacing:-.04em;
  margin:7px 0 6px;color:var(--ink);
}
.hero h1 .nm{color:inherit}
.hero .topline{font-size:12.5px;color:var(--ink3);line-height:1.5}
.hero-note{
  margin-top:13px;border-radius:var(--r-sm);padding:13px 15px;
  font-size:13.5px;line-height:1.62;color:var(--ink2);
}
.hero-note b{color:var(--ink)}

/* 통계 */
.stats{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:9px;
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin:14px calc(var(--pad) * -1) 4px;padding:2px var(--pad) 6px;
}
.stats::-webkit-scrollbar{display:none}
.stats[hidden]{display:none}
.stat{scroll-snap-align:start;padding:11px 13px 12px;border-radius:18px;min-height:86px;
  display:flex;flex-direction:column;justify-content:space-between}
.stat .k{font-size:11px;font-weight:640;color:var(--ink3);letter-spacing:-.005em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.stat .vline{display:flex;align-items:baseline;gap:3px;margin-top:5px}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.stat .u{font-size:11.5px;font-weight:600;color:var(--ink3)}
.stat .s{font-size:10.5px;color:var(--ink3);margin-top:3px;line-height:1.35}
.stat[data-tone="urgent"] .v{color:var(--urgent)}
.stat[data-tone="live"] .v{color:var(--live)}

/* 섹션 */
.sec{margin-top:26px;scroll-margin-top:120px}
.sec-head{display:flex;align-items:center;gap:8px;padding:0 2px;margin-bottom:10px}
.sec-head h2{font-size:16.5px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.sec-n{color:var(--ink3);font-weight:650;margin-right:2px}
body.filtered .sec-n{display:none}
.sec-head .cnt{font-size:11.5px;color:var(--ink3);font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sec-fold{
  margin-left:auto;flex:0 0 auto;width:26px;height:26px;border:0;border-radius:9px;
  background:rgba(255,255,255,.55);color:var(--ink3);cursor:pointer;
  display:grid;place-items:center;transition:transform .25s, background .2s;
  box-shadow:inset 0 0 0 .7px rgba(255,255,255,.8);
}
@media (prefers-color-scheme: dark){
  .sec-fold{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 .7px rgba(255,255,255,.10)}
}
.sec-fold svg{width:11px;height:11px;transition:transform .25s}
.sec.folded .sec-fold svg{transform:rotate(-90deg)}
.sec-body{display:grid;gap:9px}
.sec.folded .sec-body{display:none}
.sec[hidden]{display:none}

/* 카드 */
.card{padding:15px 16px 16px;border-radius:var(--r);overflow:hidden}
.card[data-accent]{position:relative}
.card[data-accent]::before{
  content:"";position:absolute;left:0;top:15px;bottom:15px;width:3px;border-radius:0 3px 3px 0;
}
.card[data-accent="hot"]::before{background:var(--urgent);box-shadow:0 0 14px rgba(217,45,51,.45)}
.card[data-accent="warm"]::before{background:var(--wait);box-shadow:0 0 14px rgba(214,138,0,.4)}
.card[data-accent="flow"]::before{background:var(--live);box-shadow:0 0 14px rgba(15,154,89,.4)}
.card[data-accent="hot"]{background-image:
  linear-gradient(100deg, rgba(217,45,51,.07), rgba(217,45,51,0) 42%),
  linear-gradient(180deg, rgba(255,255,255,.50) 0%, rgba(255,255,255,.06) 34%, rgba(255,255,255,0) 62%),
  linear-gradient(180deg, var(--g1), var(--g2));}
.card[data-accent="warm"]{background-image:
  linear-gradient(100deg, rgba(214,138,0,.07), rgba(214,138,0,0) 42%),
  linear-gradient(180deg, rgba(255,255,255,.50) 0%, rgba(255,255,255,.06) 34%, rgba(255,255,255,0) 62%),
  linear-gradient(180deg, var(--g1), var(--g2));}

.card-top{display:flex;align-items:flex-start;gap:10px}
.card-ttl{flex:1 1 auto;min-width:0}
.card-ttl h3{font-size:14.5px;font-weight:660;letter-spacing:-.025em;line-height:1.36;text-wrap:balance}
.card-meta{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.45;font-weight:500}
.card-body{font-size:13.5px;line-height:1.66;color:var(--ink2);margin-top:9px}
.card-body b{color:var(--ink);font-weight:650}
.card-body ul{display:grid;gap:5px;margin-top:2px}
.card-body li{position:relative;padding-left:13px}
.card-body li::before{
  content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;border-radius:50%;
  background:var(--ink3);opacity:.55;
}
.kv{display:grid;gap:9px;margin-top:11px}
.kv .kvrow{display:grid;grid-template-columns:66px 1fr;gap:10px;align-items:start}
.kv .k{font-size:10.5px;font-weight:700;letter-spacing:.01em;color:var(--ink3);padding-top:2px;white-space:nowrap}
.kv .v{font-size:13px;line-height:1.6;color:var(--ink2)}
.kv .v b{color:var(--ink);font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.chip{font-size:10.5px;font-weight:650;letter-spacing:-.01em;padding:3.5px 9px;border-radius:999px;
  background:rgba(120,135,160,.13);color:var(--ink2)}
.chip.red{background:var(--urgent-bg);color:var(--urgent)}
.chip.green{background:var(--live-bg);color:var(--live)}

/* 배지 */
.badge{
  flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.005em;
  padding:3.5px 9px;border-radius:999px;white-space:nowrap;
  background:var(--pause-bg);color:var(--pause);
}
.badge.urgent{background:var(--urgent-bg);color:var(--urgent)}
.badge.wait{background:var(--wait-bg);color:var(--wait)}
.badge.doing{background:var(--doing-bg);color:var(--doing)}
.badge.live{background:var(--live-bg);color:var(--live)}
.badge.pause{background:var(--pause-bg);color:var(--pause)}

/* 날씨 */
.wx{display:grid;gap:9px}
@media (min-width:720px){.wx{grid-template-columns:1fr 1fr}}
.wxcard{padding:15px 16px 14px;border-radius:var(--r)}
.wxhead{display:flex;align-items:center;gap:8px}
.wxhead h3{font-size:13.5px;font-weight:650;letter-spacing:-.02em}
.wxtag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;
  background:rgba(10,108,255,.12);color:var(--accent)}
.wxsub{font-size:10.5px;color:var(--ink3);margin-top:2px}
.wxnow{display:flex;align-items:center;gap:13px;margin-top:10px}
.wxtemp{font-size:40px;font-weight:700;letter-spacing:-.05em;line-height:.95;display:flex;align-items:flex-start;gap:2px}

}

.lock-card{
  width:min(380px,100%);padding:30px 22px 20px;border-radius:30px;text-align:center;
  animation:lockIn .36s cubic-bezier(.2,.8,.2,1) both;
}

}
.pin::placeholder{color:var(--ink3);opacity:.5;letter-spacing:.42em}
.pin:focus{box-shadow:inset 0 0 0 2px var(--accent), 0 6px 18px rgba(10,108,255,.18)}
.pin[disabled]{opacity:.6}
@media (prefers-color-scheme: dark){
  .pin{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 .8px rgba(255,255,255,.16)}
}
.unlock{
  width:100%;border:0;cursor:pointer;font-family:var(--font);font-size:14.5px;font-weight:660;

.lockerr.info{color:var(--ink3)}
.locknote{margin-top:14px;font-size:10.5px;color:var(--ink3);line-height:1.6}
.locknote b{font-weight:650}
.lockbtn{
  flex:0 0 auto;border:0;cursor:pointer;font-family:var(--font);font-size:11px;font-weight:650;
  color:var(--ink2);background:rgba(255,255,255,.52);padding:6px 10px;border-radius:999px;
  box-shadow:inset 0 0 0 .7px rgba(255,255,255,.85), 0 1px 2px rgba(20,30,60,.06);

}

  .lockbtn{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 .7px rgba(255,255,255,.14)}
}

.loading-line{position:fixed;top:0;left:0;right:0;height:2px;z-index:70;overflow:hidden;opacity:0;transition:opacity .2s}
.loading-line.on{opacity:1}
.loading-line i{display:block;height:100%;width:40%;border-radius:2px;
  background:linear-gradient(90deg,transparent,#0a6cff,transparent);animation:slide 1.1s ease-in-out infinite}

@media (min-width:900px){

<body class="locked">
<div class="mesh" aria-hidden="true"></div>
<div class="statusveil" aria-hidden="true"></div>
<div class="loading-line" id="loadbar" aria-hidden="true"><i></i></div>

<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="lock-card glass">
    <div class="lock-icon" aria-hidden="true">🔒</div>
    <h2 id="lockTitle">브리핑 잠금</h2>
    <p class="lock-sub">6자리 PIN을 입력하면 오늘 브리핑이 열려.</p>
    <form class="pinform" id="lockForm" novalidate>
      <input class="pin" id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*"
             maxlength="6" autocomplete="one-time-code" autocorrect="off" autocapitalize="off"
             spellcheck="false" enterkeyhint="go" placeholder="······"
             aria-label="6자리 PIN" aria-describedby="lockErr">
      <button class="unlock" id="unlockBtn" type="submit">잠금 해제</button>
    </form>
    <div class="lockerr" id="lockErr" role="alert" aria-live="polite"></div>
    <p class="locknote">PIN은 이 기기에만 저장돼. 볼일이 끝나면 상단 <b>🔒 잠금</b> 버튼을 눌러.</p>
  </div>
</div>

<header class="nav">

    <div class="nav-row">
      <div class="brand">

            <span id="dateText">불러오는 중</span>

      <button class="chipf" type="button" data-filter="all" aria-pressed="true">전체</button>

  <div class="wrap" style="padding:20px">
    <div class="notice glass"><h3>JavaScript가 필요해</h3><p>이 브리핑 앱은 데이터를 불러와 화면을 그리기 때문에 JavaScript가 켜져 있어야 해.</p></div>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ────────── 상수 & 유틸 ────────── */
  var DATA_DIR = "data/";
  var PIN_KEY = "briefing_pin";
  var PIN_LEN = 6;
  var DEFAULT_ITER = 310000;
  var WEEK = ["일","월","화","수","목","금","토"];
  var FILTERS = ["all","fd","me","tr","au"];
  var LS = {
    get: function(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
    set: function(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  };

  var $ = function(sel, root){ return (root || document).querySelector(sel); };
  var $$ = function(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  // **굵게** 미니 마크업 (HTML 이스케이프 후 적용)
  function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }

  function parseDate(str){ // "2026-11-18" → Date (로컬 자정)
    var p = String(str).split("-");
    return new Date(+p[0], (+p[1]) - 1, +p[2]);
  }
  function ymd(d){
    var m = String(d.getMonth() + 1), day = String(d.getDate());
    return d.getFullYear() + "-" + (m.length < 2 ? "0" + m : m) + "-" + (day.length < 2 ? "0" + day : day);
  }
  function todayYmd(){ return ymd(new Date()); }
  function shortDate(str){
    var d = parseDate(str);
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + WEEK[d.getDay()] + ")";
  }
  function longDate(str){
    var d = parseDate(str);
    return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + WEEK[d.getDay()] + "요일";
  }

  var state = {
    dates: [],        // 오름차순
    current: null,
    data: null,
    filter: FILTERS.indexOf(LS.get("db.filter","all")) >= 0 ? LS.get("db.filter","all") : "all",
    folded: (function(){
      try{ var a = JSON.parse(LS.get("db.folded","[]")); return Array.isArray(a) ? a : []; }catch(e){ return []; }
    })(),
    cache: {},
    busy: false,
    pin: null,      // 이번 세션에서만 메모리에 두는 PIN
    start: null,    // 잠금 해제 시 가장 먼저 열 날짜
    locked: true
  };

  /* ────────── 네트워크 ────────── */
  function fetchJSON(path){
    return fetch(path, { cache: "no-store" }).then(function(r){
      if(!r.ok) throw new Error(r.status + " " + r.statusText + " · " + path);
      return r.json();
    });
  }

  function loading(on){
    state.busy = !!on;
    var bar = $("#loadbar");
    if(bar) bar.classList.toggle("on", !!on);
    $$(".arrow").forEach(function(b){ b.disabled = b.disabled || !!on; });
    if(!on) syncArrows();
  }

  /* ────────── 복호화 (Web Crypto: PBKDF2-SHA256 → AES-256-GCM) ────────── */
  var subtle = (window.crypto && window.crypto.subtle) || null;
  var keyCache = {};

  function b64bytes(b64){
    var bin = atob(String(b64 || ""));
    var out = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function deriveKey(pin, saltB64, iter){
    var id = iter + "|" + saltB64 + "|" + pin;
    if(keyCache[id]) return keyCache[id];
    return subtle.importKey("raw", new TextEncoder().encode(pin), { name: "PBKDF2" }, false, ["deriveKey"])
      .then(function(base){
        return subtle.deriveKey(
          { name: "PBKDF2", salt: b64bytes(saltB64), iterations: iter, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      })
      .then(function(key){ keyCache[id] = key; return key; });
  }

  function decryptEnvelope(env, pin){
    if(!subtle) return Promise.reject(new Error("이 브라우저에서는 암호를 풀 수 없어"));
    if(!env || !env.salt || !env.iv || !env.ct){
      return Promise.reject(new Error("암호문 형식이 올바르지 않아"));
    }
    return deriveKey(pin, env.salt, env.iter || DEFAULT_ITER).then(function(key){
      return subtle.decrypt({ name: "AES-GCM", iv: b64bytes(env.iv), tagLength: 128 }, key, b64bytes(env.ct));
    }).then(function(buf){
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }

  // 날짜 하나를 암호문에서 열기. 틀린 PIN이면 err.pinWrong = true
  function openDate(date, pin){
    return fetchJSON(DATA_DIR + date + ".enc.json").then(function(env){
      return decryptEnvelope(env, pin).catch(function(){
        var err = new Error("PIN이 맞지 않아");
        err.pinWrong = true;
        throw err;
      });
    }).then(function(d){
      if(!d || d.date !== date) throw new Error("복호화된 데이터의 날짜가 맞지 않아");
      return d;
    });
  }

  /* ────────── 잠금 UI ────────── */
  function setLockError(msg, tone){
    var e = $("#lockErr");
    if(!e) return;
    e.textContent = msg || "";
    e.className = "lockerr" + (tone === "info" ? " info" : "");
  }

  function lockBusy(on){
    var btn = $("#unlockBtn"), input = $("#pinInput");
    if(btn){ btn.disabled = !!on; btn.textContent = on ? "여는 중…" : "잠금 해제"; }
    if(input) input.disabled = !!on;
  }

  function clearNav(){
    var sel = $("#dateSel"); if(sel) sel.innerHTML = "";
    var txt = $("#dateText"); if(txt) txt.textContent = "잠김";
    var tag = $("#todayTag"); if(tag) tag.hidden = true;
    var p = $("#prevDay"), n = $("#nextDay");
    if(p) p.disabled = true;
    if(n) n.disabled = true;
  }

  function showLock(msg, tone){
    state.locked = true;
    document.body.classList.add("locked");
    var box = $("#lock");
    if(box) box.hidden = false;
    lockBusy(false);
    $("#content").innerHTML = '<div class="skel glass" aria-hidden="true"><div class="ln w2"></div><div class="ln w1"></div><div class="ln w3"></div></div>';
    setLockError(msg || "", tone);
    var input = $("#pinInput");
    if(input) input.value = "";
  }

  function hideLock(){
    state.locked = false;
    document.body.classList.remove("locked");
    var box = $("#lock");
    if(box) box.hidden = true;
    setLockError("");
  }

  // PIN으로 열기. opt.auto = 저장된 PIN으로 자동 시도
  function unlock(pin, opt){
    opt = opt || {};
    if(!/^\d{6}$/.test(pin)){
      setLockError(opt.auto ? "" : "6자리 숫자를 입력해줘");
      return Promise.resolve(false);
    }
    lockBusy(true);
    setLockError("");
    return openDate(state.start, pin).then(function(d){
      state.pin = pin;
      state.cache = {};
      state.cache[d.date] = d;
      state.current = d.date;
      state.data = d;
      LS.set(PIN_KEY, pin);
      LS.set("db.date", d.date);
      try{ history.replaceState(null, "", "#" + d.date); }catch(e){}
      hideLock();
      loading(false);
      render(d);
      syncArrows();
      afterRender();
      lockBusy(false);
      return true;
    }).catch(function(err){
      lockBusy(false);
      if(err && err.pinWrong){
        LS.set(PIN_KEY, ""); // 틀린 PIN은 저장하지 않는다
        var input = $("#pinInput");
        if(input) input.value = "";
        setLockError(opt.auto ? "저장된 PIN이 더는 맞지 않아. 다시 입력해줘." : "PIN이 맞지 않아", opt.auto ? "info" : "");
      } else {
        setLockError(err && err.message ? err.message : "여는 중에 문제가 생겼어", "info");
      }
      return false;
    });
  }

  function lockNow(msg){
    state.pin = null;
    state.data = null;
    state.current = null;
    state.cache = {};
    keyCache = {};
    LS.set(PIN_KEY, "");
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    clearNav();
    loading(false);
    showLock(msg || "", "info");
  }

  function bindLock(){
    var form = $("#lockForm");
    if(form){
      form.addEventListener("submit", function(e){
        e.preventDefault();
        var input = $("#pinInput");
        if(!input || input.disabled) return;
        unlock((input.value || "").trim(), { auto: false });
      });
    }
    var input = $("#pinInput");
    if(input){
      input.addEventListener("input", function(){
        var clean = input.value.replace(/\D/g, "").slice(0, PIN_LEN);
        if(clean !== input.value) input.value = clean;
        if($("#lockErr").textContent) setLockError("");
        var btn = $("#unlockBtn");
        if(clean.length === PIN_LEN && btn && !btn.disabled) unlock(clean, { auto: false });
      });
      input.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); }
      });
    }
    var lockBtn = $("#lockBtn");
    if(lockBtn){
      lockBtn.addEventListener("click", function(){ lockNow("잠갔어. PIN을 입력하면 다시 열려."); });
    }
  }

  /* ────────── 날짜 컨트롤 ────────── */
  function buildDateOptions(){
    var sel = $("#dateSel");
    var list = state.dates.slice().reverse(); // 최신이 위
    sel.innerHTML = list.map(function(d){
      return '<option value="' + d + '">' + esc(longDate(d)) + "</option>";
    }).join("");
  }

  function syncArrows(){
    var i = state.dates.indexOf(state.current);
    $("#prevDay").disabled = state.busy || i <= 0;
    $("#nextDay").disabled = state.busy || i < 0 || i >= state.dates.length - 1;
    $("#dateText").textContent = state.current ? shortDate(state.current) : "날짜 없음";
    $("#todayTag").hidden = state.current !== todayYmd();
    $("#dateSel").value = state.current || "";
  }

  function step(delta){
    var i = state.dates.indexOf(state.current);
    var next = state.dates[i + delta];
    if(next) loadDate(next);
  }

  /* ────────── 렌더: 조각들 ────────── */
  function badgeHTML(b){
    if(!b) return "";
    return '<span class="badge ' + esc(b.tone || "") + '">' + esc(b.text) + "</span>";
  }

  function statHTML(s){
    var unit = s.unit ? '<span class="u">' + esc(s.unit) + "</span>" : "";
    return '<div class="stat glass" data-tone="' + esc(s.tone || "") + '">' +
      '<div class="k">' + esc(s.k) + "</div>" +
      '<div><div class="vline"><span class="v num">' + esc(s.v) + "</span>" + unit + "</div>" +
      '<div class="s">' + esc(s.s || "") + "</div></div></div>";
  }

  function cardHTML(c){
    var out = '<article class="card glass"' + (c.accent ? ' data-accent="' + esc(c.accent) + '"' : "") + ">";
    out += '<div class="card-top"><div class="card-ttl">';
    out += "<h3>" + md(c.title) + "</h3>";
    if(c.meta) out += '<div class="card-meta">' + md(c.meta) + "</div>";
    out += "</div>" + badgeHTML(c.badge) + "</div>";

    if(c.body) out += '<div class="card-body">' + md(c.body) + "</div>";
    if(c.bullets && c.bullets.length){
      out += '<div class="card-body"><ul>' + c.bullets.map(function(x){ return "<li>" + md(x) + "</li>"; }).join("") + "</ul></div>";
    }
    if(c.kv && c.kv.length){
      out += '<div class="kv">' + c.kv.map(function(r){
        return '<div class="kvrow"><div class="k">' + esc(r.k) + '</div><div class="v">' + md(r.v) + "</div></div>";
      }).join("") + "</div>";
    }
    if(c.chips && c.chips.length){
      out += '<div class="chips">' + c.chips.map(function(ch){
        return '<span class="chip ' + esc(ch.tone || "") + '">' + esc(ch.text) + "</span>";
      }).join("") + "</div>";
    }
    return out + "</article>";
  }

  function weatherHTML(block){
    return '<div class="wx">' + block.places.map(function(p){
      var rows = p.rows.map(function(r){
        return '<div class="wxitem"><div class="k">' + esc(r.k) + '</div><div class="v">' + md(r.v) + "</div></div>";
      }).join("");
      var attrs = (p.attrs || []).map(function(a){
        return '<a href="' + esc(a.u) + '" target="_blank" rel="noopener">' + esc(a.t) + "</a>";
      }).join(" · ");
      return '<div class="wxcard glass">' +
        '<div class="wxhead"><h3>' + esc(p.name) + "</h3>" +
          (p.tag ? '<span class="wxtag">' + esc(p.tag) + "</span>" : "") + "</div>" +
        '<div class="wxsub">' + esc(p.sub || "") + "</div>" +
        '<div class="wxnow"><div class="wxtemp num">' + esc(p.temp) + "<small>°C</small></div>" +
          '<div><div class="wxcond">' + esc(p.cond) + "</div>" +
          '<div class="wxfeel">' + esc(p.feel) + "</div></div></div>" +
        '<div class="wxgrid">' + rows + "</div>" +
        (attrs ? '<div class="wxattr">' + attrs + "</div>" : "") +
      "</div>";
    }).join("") + "</div>";
  }

  function tableHTML(t){
    var head = t.columns.map(function(c){
      return "<th" + (c.cls ? ' class="' + esc(c.cls) + '"' : "") + ">" + esc(c.label) + "</th>";
    }).join("");
    var body = t.rows.map(function(row){
      return "<tr>" + row.map(function(cell, ci){
        var colCls = (t.columns[ci] && t.columns[ci].cls) || "";
        var cls = (cell && cell.cls) || colCls;
        if(cell && cell.badge){
          return '<td' + (cls ? ' class="' + esc(cls) + '"' : "") + '><span class="badge ' + esc(cell.badge.tone || "") + '">' + esc(cell.badge.text) + "</span></td>";
        }
        var txt = (cell && cell.t != null) ? cell.t : cell;
        return "<td" + (cls ? ' class="' + esc(cls) + '"' : "") + ">" + md(txt) + "</td>";
      }).join("") + "</tr>";
    }).join("");
    return '<div class="tblwrap glass"><table class="tbl"><thead><tr>' + head +
      "</tr></thead><tbody>" + body + "</tbody></table></div>";
  }

  function listHTML(b){
    return '<div class="alist glass">' + (b.items || []).map(function(it){
      return '<div class="alrow">' +
        '<div class="al-t">' + md(it.title) + '</div>' +
        badgeHTML(it.badge) +
        '<div class="al-m">' + md(it.period || "") + '</div>' +
        '<div class="al-n">' + (it.next && it.next !== "—" ? "다음 " + esc(it.next) : "—") + '</div>' +
      '</div>';
    }).join("") + "</div>";
  }

  function blockHTML(b){
    switch(b.type){
      case "weather": return weatherHTML(b);
      case "cards":   return (b.cards || []).map(cardHTML).join("");
      case "table":   return tableHTML(b);
      case "list":    return listHTML(b);
      case "note":    return '<div class="note">' + md(b.text) + "</div>";
      default:        return "";
    }
  }

  function sectionHTML(sec, index){
    var folded = state.folded.indexOf(sec.id) >= 0;
    var cats = (sec.cats || []).join(" ");
    return '<section class="sec' + (folded ? " folded" : "") + '" id="sec-' + esc(sec.id) + '" data-cats="' + esc(cats) + '">' +
      '<div class="sec-head"><h2><span class="sec-n">' + (index + 1) + ".</span> " + esc(sec.title) + "</h2>" +
        '<span class="cnt">' + esc(sec.count || "") + "</span>" +
        '<button class="sec-fold" type="button" aria-label="접기/펼치기" aria-expanded="' + (!folded) + '">' +
          '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        "</button></div>" +
      '<div class="sec-body">' + (sec.blocks || []).map(blockHTML).join("") + "</div>" +
    "</section>";
  }

  function footerHTML(d){
    var basis = (d.meta && d.meta.basis || []).map(function(r){
      return '<div><span class="k">' + esc(r.k) + '</span> · ' + esc(r.v) + "</div>";
    }).join("");
    var unv = (d.meta && d.meta.unverified || []).map(function(x){
      return "<span>" + esc(x) + "</span>";
    }).join("");
    return '<footer><div class="foot-card glass">' +
      '<h4>데이터 기준</h4><div class="foot-kv">' + basis + "</div>" +
      (unv ? '<h4 style="margin-top:14px">확인되지 않은 것</h4><div class="foot-unv">' + unv + "</div>" : "") +
      '<button class="refresh" type="button" id="refreshBtn">새로고침</button>' +
      '<div class="foot-fine">' + esc(d.asOfFull || d.asOf || "") + " 기준<br>홈 화면에 추가하면 앱처럼 열려.</div>" +
    "</div></footer>";
  }

  /* ────────── 렌더: 전체 ────────── */
  function render(d){
    var today = todayYmd();
    var isToday = d.date === today;
    var html = "";

    html += '<div class="hero">' +
      '<div class="eyebrow"><span class="dash"></span>' + esc(longDate(d.date)) + "</div>" +
      "<h1><span class=" + '"nm"' + ">" + esc(d.title || "오늘의 브리핑") + "</span></h1>" +
      '<div class="topline">' + esc(d.topline || "") + (isToday ? "" : " · 지난 브리핑") + "</div>" +
      (d.note ? '<div class="hero-note glass">' + md(d.note) + "</div>" : "") +
    "</div>";

    if(d.stats && d.stats.length){
      html += '<div class="stats">' + d.stats.map(statHTML).join("") + "</div>";
    }

    html += (d.sections || []).map(sectionHTML).join("");
    html += footerHTML(d);

    $("#content").innerHTML = html;
    applyFilter(state.filter, true);

    var rb = $("#refreshBtn");
    if(rb) rb.addEventListener("click", function(){ loadDate(state.current, true); });
  }

  function renderShellMessage(title, bodyHTML, showRetry){
    var fileHint = "";
    if(location.protocol === "file:"){
      fileHint = "<p style=\"margin-top:8px\">지금 <code>file://</code> 로 열려 있어서 브라우저가 데이터 파일 읽기를 막고 있어. " +
        "터미널에서 <code>python3 -m http.server</code> 로 띄우거나, HTTPS 주소로 열면 정상 동작해.</p>";
    }
    $("#content").innerHTML = '<div class="hero"><div class="eyebrow"><span class="dash"></span>DAILY BRIEFING</div>' +
      '<h1>브리핑 데이터를<br>불러오지 못했어</h1></div>' +
      '<div class="notice glass"><h3>' + esc(title) + "</h3><p>" + bodyHTML + "</p>" + fileHint +
      (showRetry ? '<div class="act"><button class="btn" type="button" id="retryBtn">다시 시도</button></div>' : "") +
      "</div>";
    var rb = $("#retryBtn");
    if(rb) rb.addEventListener("click", function(){
      if(state.pin && state.current) loadDate(state.current, true);
      else boot();
    });
  }

  /* ────────── 필터 / 접기 ────────── */
  function applyFilter(f, keepScroll){
    state.filter = f;
    LS.set("db.filter", f);
    $$(".chipf").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-filter") === f ? "true" : "false");
    });
    $$(".sec").forEach(function(sec){
      if(f === "all"){ sec.hidden = false; return; }
      var cats = (sec.getAttribute("data-cats") || "").split(/\s+/);
      sec.hidden = cats.indexOf(f) === -1;
    });
    var stats = $(".stats");
    if(stats) stats.hidden = (f !== "all");
    document.body.classList.toggle("filtered", f !== "all");
    if(!keepScroll) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function bindFilters(){
    $$(".chipf").forEach(function(btn){
      btn.addEventListener("click", function(){
        applyFilter(btn.getAttribute("data-filter"));
      });
    });
  }

  function bindFolds(root){
    $$(".sec-fold", root).forEach(function(btn){
      btn.addEventListener("click", function(){
        var sec = btn.closest(".sec");
        var open = !sec.classList.contains("folded");
        sec.classList.toggle("folded", open);
        btn.setAttribute("aria-expanded", String(!open));
        var id = sec.id.replace(/^sec-/, "");
        var i = state.folded.indexOf(id);
        if(open && i === -1) state.folded.push(id);
        if(!open && i >= 0) state.folded.splice(i, 1);
        LS.set("db.folded", JSON.stringify(state.folded));
      });
    });
  }

  /* ────────── 날짜 로드 ────────── */
  function loadDate(date, force){
    if(!date){ return Promise.resolve(); }
    if(!state.pin){ showLock(); return Promise.resolve(); }
    if(state.cache[date] && !force){
      state.current = date;
      state.data = state.cache[date];
      render(state.data);
      syncArrows();
      afterRender();
      return Promise.resolve();
    }
    loading(true);
    return openDate(date, state.pin).then(function(d){
      state.cache[date] = d;
      state.current = date;
      state.data = d;
      LS.set("db.date", date);
      try{ history.replaceState(null, "", "#" + date); }catch(e){}
      render(d);
      syncArrows();
      afterRender();
      loading(false);
    }).catch(function(err){
      loading(false);
      if(err && err.pinWrong){ lockNow("PIN이 맞지 않아"); return; }
      state.current = date;
      syncArrows();
      renderShellMessage("데이터 파일을 찾지 못했어",
        "<code>" + esc(DATA_DIR + date + ".enc.json") + "</code> 을 읽을 수 없었어. (" + esc(err.message) + ")", true);
    });
  }

  function afterRender(){
    bindFolds($("#content"));
    var last = $(".sec:not([hidden])");
    applyFilter(state.filter, true);
  }

  /* ────────── 부팅 ────────── */
  function pickStart(idx, dates){
    var start = (idx && idx.latest) || dates[dates.length - 1];
    var hash = (location.hash || "").replace(/^#/, "");
    var saved = LS.get("db.date", "");
    if(hash && dates.indexOf(hash) >= 0) start = hash;
    else if(saved && dates.indexOf(saved) >= 0) start = saved;
    return start;
  }

  function boot(){
    showLock();
    if(location.protocol === "file:"){
      setLockError("file:// 로는 암호를 풀 수 없어. 터미널에서 python3 -m http.server 로 띄우거나 HTTPS 주소로 열어줘.", "info");
      return;
    }
    if(!subtle){
      setLockError("이 브라우저는 Web Crypto를 지원하지 않아. 사파리·크롬 최신 버전에서 열어줘.", "info");
      return;
    }
    loading(true);
    fetchJSON(DATA_DIR + "index.json").then(function(idx){
      var dates = (idx && idx.dates ? idx.dates : []).filter(Boolean).sort();
      if(!dates.length) throw new Error("index.json 에 날짜가 없어");
      state.dates = dates;
      state.start = pickStart(idx, dates);
      buildDateOptions();
      loading(false);
      lockBusy(false);

      var saved = LS.get(PIN_KEY, "");
      if(saved && /^\d{6}$/.test(saved)){
        return unlock(saved, { auto: true });
      }
    }).catch(function(err){
      loading(false);
      if(!state.dates.length){
        setLockError("날짜 목록(index.json)을 읽지 못했어 (" + (err && err.message ? err.message : "오류") + ")", "info");
      }
    });
  }

  function bindNav(){
    $("#prevDay").addEventListener("click", function(){ step(-1); });
    $("#nextDay").addEventListener("click", function(){ step(1); });
    $("#dateSel").addEventListener("change", function(e){
      var v = e.target.value;
      if(v && v !== state.current) loadDate(v);
    });
    bindFilters();
  }

  if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  document.addEventListener("DOMContentLoaded", function(){
    bindLock();
    bindNav();
    boot();
  });
})();
</script>
</body>
</html>
